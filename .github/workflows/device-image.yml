# Builds the device image (/device) that cloud devices run, for amd64 and
# arm64, and publishes it to GHCR as ghcr.io/<owner>/localbot-device.
name: Device image

on:
  push:
    branches: [main]
    paths: [device/**, .github/workflows/device-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/localbot-device" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: device
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
