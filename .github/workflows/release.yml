name: Release

# Push a tag like v0.1.0 to build the app and attach the DMG to a draft GitHub
# Release. The maintainer then runs scripts/publish-release.sh on their Mac,
# which signs it for Sparkle (the key never leaves that Mac) and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    # macOS 26 / Xcode 26: the device runtime needs its SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - name: Tests
        working-directory: brain
        run: npm ci && npm run check
      - name: Check VERSION matches the tag
        run: |
          [ "v$(cat VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "VERSION is $(cat VERSION), tag is ${GITHUB_REF_NAME}"; exit 1; }
      # The kernel the device VMs boot comes out of a 660 MB Kata package.
      - uses: actions/cache@v4
        with:
          path: .build-cache/vmlinux-*
          key: device-kernel-kata-3.32.0
      - name: Build app and DMG
        run: scripts/build-app.sh
      - name: Check the device runtime is in the app
        run: |
          test -x "dist/Local Bot.app/Contents/Helpers/localbot-runtime"
          test -f "dist/Local Bot.app/Contents/Resources/runtime/vmlinux"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/LocalBot-$(cat VERSION).dmg" \
            --title "Local Bot ${GITHUB_REF_NAME}" --generate-notes --draft
