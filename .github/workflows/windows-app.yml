name: Windows app

# Builds the Windows installers (NSIS .exe and .msi) with Node and the bundled
# brain inside, and keeps them as a workflow artifact. Unsigned for now:
# Windows SmartScreen asks once ("More info" → "Run anyway").
on:
  push:
    branches: [windows]
    paths: ["apps/desktop/**", "brain/**", ".github/workflows/windows-app.yml", "VERSION"]
  workflow_dispatch:

env:
  NODE_VERSION: "22.22.3"

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            brain/package-lock.json
            apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Bundle the brain
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          OUT=apps/desktop/src-tauri/resources
          mkdir -p "$OUT/brain"
          (cd brain && npm ci)
          brain/node_modules/.bin/esbuild brain/src/index.ts --bundle --platform=node --format=esm \
            --target=node22 --outfile="$OUT/brain/brain.mjs" --log-level=warning \
            --define:process.env.LOCALBOT_VERSION="\"$VERSION\""

      - name: Node runtime
        shell: bash
        run: |
          ZIP="node-v$NODE_VERSION-win-x64.zip"
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/$ZIP"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" | grep " $ZIP\$" | sha256sum -c -
          unzip -q -j "$ZIP" "node-v$NODE_VERSION-win-x64/node.exe" -d apps/desktop/src-tauri/resources

      # The bundled brain must start on Windows and answer: what the app sees
      # as "The brain stopped" otherwise. Run from another folder, as an
      # installed app would be.
      - name: Smoke test the bundled brain
        shell: bash
        run: |
          R="$PWD/apps/desktop/src-tauri/resources"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          printf '%s\n' '{"id":1,"method":"app.info"}' '{"id":2,"method":"providers.status"}' \
            '{"id":3,"method":"bots.list"}' '{"id":4,"method":"computers.list"}' > in.txt
          { cat in.txt; sleep 20; } | timeout 40 "$R/node.exe" "$R/brain/brain.mjs" > out.txt 2> err.txt || echo "brain exited with $?"
          echo "--- stdout"; cut -c1-300 out.txt
          echo "--- stderr"; cat err.txt
          grep -q '"id":4' out.txt

      - name: Build installers
        shell: bash
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json --config "{\"version\":\"$(cat ../../VERSION)\"}"

      # The installed app, as a user gets it: install silently, open it, and
      # check its brain is running (what failed as "The brain stopped").
      - name: Smoke test the installed app
        shell: bash
        run: |
          EXE=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          "$EXE" /S
          sleep 5
          DIR="$LOCALAPPDATA/Local Bot"
          echo "--- installed in $DIR"; ls -R "$DIR" | head -40
          APP=$(ls "$DIR"/*.exe | grep -vi uninstall | head -1)
          echo "--- starting $APP"
          "$APP" &
          sleep 25
          echo "--- processes"; tasklist | grep -iE "node|local" || true
          LOG="$LOCALAPPDATA/io.github.patrick-mns.localbot/logs/brain.log"
          echo "--- $LOG"; cat "$LOG" || true
          tasklist | grep -qi "node.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalBot-windows-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
